name: Build Android APK

on:
  workflow_dispatch:          # lets you press "Run workflow" from the GitHub mobile site/app
  push:
    branches: [android-native]
    paths: ["android/**", ".github/workflows/android.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3   # installs the SDK and accepts its licences

      - uses: gradle/actions/setup-gradle@v4     # caches Gradle so re-runs are fast

      - name: Engine tests (JVM)
        run: ./gradlew :core:test --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: direct-stream-ps5-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload reports (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            android/core/build/reports/tests
            android/app/build/reports
          if-no-files-found: ignore
